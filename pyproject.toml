[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probity"
version = "1.0.0"
description = "An AI polygraph for open language models: a linear probe on Gemma's hidden states that flags and blocks claims the model believes are false."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alberto Gomez Soteres" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
model = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.30"]
dev = ["pytest>=7", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
