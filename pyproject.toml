[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "probity"
version = "1.1.0"
description = "A white-box polygraph and guardrail for open language models: a calibrated linear probe on Gemma's hidden states that flags and blocks claims the model believes are false."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Gomez Soteres" }]
requires-python = ">=3.10"
keywords = ["llm", "interpretability", "probing", "guardrails", "explainable-ai", "gemma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# The training and evaluation pipeline (no GPU needed for the data stage, the reports and the tests).
pipeline = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]
# Loading Gemma and reading its hidden states (a GPU is strongly recommended).
model = [
    "accelerate>=0.30",
    "huggingface_hub>=0.24",
    "torch>=2.1",
    "transformers>=4.56",
]
# Word attributions (LIME, KernelSHAP, Integrated Gradients).
explain = [
    "scipy>=1.10",
    "shap>=0.44",
]
# Figures for the README and the poster.
reports = [
    "matplotlib>=3.7",
]
# The interactive Probity app.
app = [
    "gradio>=4.44",
]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
all = ["probity[pipeline,model,explain,reports,app]"]

[project.scripts]
probity = "probity.cli:main"

[project.urls]
Repository = "https://github.com/albertogomezsoteres/probity"
Issues = "https://github.com/albertogomezsoteres/probity/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: needs internet access (downloads the Geometry of Truth datasets)",
]

[tool.coverage.run]
source = ["probity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",    # long lines: the formatter handles code, long strings are kept readable
    "E731",    # small lambdas are clearer inline in the plotting code
    "B905",    # zip() without strict= keeps the original behaviour on Python 3.10
    "RUF001",  # typographic quotes and dashes are intended in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["probity"]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
files = ["src/probity"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
