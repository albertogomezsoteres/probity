name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs the exact versions in uv.lock, so CI and local runs use the same tools.
env:
  EXTRAS: --extra pipeline --extra reports --extra explain --extra app --extra dev

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen $EXTRAS
      - name: Ruff (lint)
        run: uv run --frozen ruff check .
      - name: Ruff (format)
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen $EXTRAS
      - name: Run tests
        run: uv run --frozen pytest --cov --cov-report=term --cov-report=xml
