# Install once with `pre-commit install`; then every commit is linted and formatted.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(results|figures|assets|notebooks)/
      - id: end-of-file-fixer
        exclude: ^(results|figures|assets|notebooks)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
